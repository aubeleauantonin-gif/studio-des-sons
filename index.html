<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#14293a"><title>FOLEY — V3</title><link rel="stylesheet" href="styles.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script><script src="app.js" defer></script></head>
<body><div class="app-shell"><header class="topbar"><span class="brand-mark" aria-label="FOLEY">♫</span><a class="top-link" href="qr.html" aria-label="Imprimer les QR codes">▦ ↗</a></header><main>
<section class="surface"><div class="section-heading"><span aria-hidden="true">📷 → ♪</span><span id="counter" class="counter">0 / 5</span></div>
<button id="scanBtn" class="primary" aria-label="Scanner une carte">▣ ＋</button>
<div id="scannerBox" class="scanner-box" hidden><div id="qr-reader"></div><button id="closeScanner" class="secondary" aria-label="Fermer la caméra">✕</button></div>
<div class="manual-controls"><select id="manualSelect" aria-label="Choisir un son pour tester"></select><button id="addManualBtn" class="secondary" aria-label="Ajouter le son">＋</button></div>
<p id="status" class="status" role="status" aria-live="polite">⌛</p></section>
<section class="surface"><ol id="trackList" class="track-list" aria-label="Séquence sonore"></ol>
<div class="edit-controls"><button id="upBtn" class="secondary" aria-label="Monter le son sélectionné">↑</button><button id="downBtn" class="secondary" aria-label="Descendre le son sélectionné">↓</button><button id="deleteBtn" class="secondary delete" aria-label="Effacer le son sélectionné">🗑</button><button id="clearBtn" class="secondary" aria-label="Tout remettre à zéro">↺</button></div>
<div class="play-controls"><button id="playBtn" class="play-button" aria-label="Jouer les cinq sons" disabled>▶</button><button id="stopBtn" class="secondary" aria-label="Arrêter la lecture" disabled>■</button></div>
<div class="progress" aria-hidden="true"><div id="progressBar" class="progress-fill"></div></div><p id="playbackInfo" class="playback-info" aria-live="polite"></p></section></main></div></body></html>
